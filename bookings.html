<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bookings and Schedule - Heat-X</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside>
      <h1>Heat-X Aircon</h1>
      <p>Services Management System</p>
      <nav><a href="index.html">Dashboard</a><a href="customers.html">Customers</a><a href="technicians.html">Technicians</a><a href="bookings.html" class="on">Bookings</a><a href="tracking.html">Service Tracking</a><a href="inventory.html">Inventory</a><a href="transactions.html">Transactions</a><a href="documents.html">Documents</a><a href="notifications.html">Notifications</a></nav>
    </aside>
    <main>
      <h2>Bookings and Schedule</h2>
    <section class="box">
      <h3 id="formTitle">Add new record</h3>
      <form id="recordForm" onsubmit="saveRecord(event)">
        <div class="formgrid">
          <label>Customer<select id="customer"></select></label>
          <label>Technician<select id="technician"></select></label>
          <label>Service<select id="service"><option>Installation</option><option>Maintenance</option><option>Repair</option><option>Cleaning</option></select></label>
          <label>Date<input type="date" id="date" required></label>
          <label>Time<input type="time" id="time" required></label>
          <label>Work permit<select id="permit"><option>Not Required</option><option>Pending</option><option>Approved</option></select></label>
          <label>Status<select id="status"><option>Pending</option><option>Scheduled</option><option>Ongoing</option><option>Completed</option></select></label>
        </div>
        <button type="submit" class="p">Save</button>
        <button type="button" onclick="cancelEdit()">Clear</button>
      </form>
    </section>
    <section class="box">
      <h3>All records</h3>
      <div class="scroll">
        <table>
          <thead><tr><th>Customer</th><th>Technician</th><th>Service</th><th>Date</th><th>Time</th><th>Work permit</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
    </main>
  </div>
  <script src="script.js"></script>
  <script>
var listName = "bookings";
var editId = null;

// Show all records in the table
function showTable() {
  var list = getList(listName);
  var html = "";
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    html += "<tr>";
    html += "<td>" + r.customer + "</td>";
    html += "<td>" + r.technician + "</td>";
    html += "<td>" + r.service + "</td>";
    html += "<td>" + r.date + "</td>";
    html += "<td>" + r.time + "</td>";
    html += "<td>" + r.permit + "</td>";
    html += "<td><span class='b " + r.status + "'>" + r.status + "</span></td>";
    html += "<td><button onclick='editRecord(" + r.id + ")'>Edit</button> <button class='x' onclick='deleteRecord(" + r.id + ")'>Delete</button></td>";
    html += "</tr>";
  }
  if (list.length == 0) {
    html = "<tr><td colspan='8'>No records yet. Use the form to add one.</td></tr>";
  }
  document.getElementById("tableBody").innerHTML = html;
}

// Save the form (add a new record or update the one being edited)
function saveRecord(event) {
  event.preventDefault();
  var list = getList(listName);
  var record = {};
  record.id = Date.now();
  record.customer = document.getElementById("customer").value;
  record.technician = document.getElementById("technician").value;
  record.service = document.getElementById("service").value;
  record.date = document.getElementById("date").value;
  record.time = document.getElementById("time").value;
  record.permit = document.getElementById("permit").value;
  record.status = document.getElementById("status").value;
  if (record.customer == "") {
    alert("Please add a customer first.");
    return;
  }
  if (record.technician == "") {
    alert("Please add a technician first.");
    return;
  }

  // if we are editing, find the old record and keep its id
  var oldRecord = null;
  if (editId != null) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id == editId) {
        oldRecord = list[i];
      }
    }
    record.id = editId;
  }
  // check the booking rules (the function is in script.js)
  var error = checkBooking(record, editId);
  if (error != "") {
    alert(error);
    return;
  }

  if (editId == null) {
    list.push(record);
  } else {
    for (var j = 0; j < list.length; j++) {
      if (list[j].id == editId) {
        list[j] = record;
      }
    }
  }
  saveList(listName, list);
  // send notifications
  if (oldRecord == null) {
    sendNotification(record, "confirm");
  } else {
    if (oldRecord.date != record.date || oldRecord.time != record.time) {
      sendNotification(record, "change");
    }
    if (oldRecord.status != record.status) {
      sendNotification(record, "status");
    }
  }

  cancelEdit();
  showTable();
}

// Put a record back in the form so it can be changed
function editRecord(id) {
  var list = getList(listName);
  for (var i = 0; i < list.length; i++) {
    if (list[i].id == id) {
      var r = list[i];
      document.getElementById("customer").value = r.customer;
      document.getElementById("technician").value = r.technician;
      document.getElementById("service").value = r.service;
      document.getElementById("date").value = r.date;
      document.getElementById("time").value = r.time;
      document.getElementById("permit").value = r.permit;
      document.getElementById("status").value = r.status;
      editId = id;
      document.getElementById("formTitle").innerText = "Edit record";
    }
  }
}

// Delete a record
function deleteRecord(id) {
  if (confirm("Delete this record?") == false) {
    return;
  }
  var list = getList(listName);
  var newList = [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].id != id) {
      newList.push(list[i]);
    }
  }
  saveList(listName, newList);
  showTable();
}

// Clear the form
function cancelEdit() {
  editId = null;
  document.getElementById("recordForm").reset();
  document.getElementById("formTitle").innerText = "Add new record";
}

// Run when the page opens
fillCustomerSelect("customer");
fillTechSelect("technician");
showTable();
  </script>
</body>
</html>
